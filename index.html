<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Debt Pool</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#047857;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:auto;padding:24px 16px 125px}h1{font-size:30px;margin:8px 0 3px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:20px;padding:17px;box-shadow:0 1px 3px #0000000d}.wide{grid-column:1/-1}
.lab{color:var(--muted);font-size:13px}.val{font-size:24px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}
section{margin-top:18px}h2{font-size:18px;margin:0 0 9px 2px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:800;white-space:nowrap}.empty{font-size:13px;color:var(--muted)}
.focus{border:2px solid var(--ink)}.bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(728px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
button{appearance:none;border:0;border-radius:15px;padding:14px 8px;font-weight:800;font-size:14px;background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}button.dark{background:#111827;color:white}
.sheet{display:none;position:fixed;z-index:10;inset:0;background:#0008;padding:20px 12px;overflow:auto}.sheet.open{display:block}.panel{max-width:700px;margin:5vh auto;background:white;border-radius:22px;padding:18px}
.panel h3{margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}
input,select{display:block;width:100%;min-height:46px;border:1px solid #d1d5db;border-radius:12px;background:white;color:#111827;padding:10px 12px;font-size:16px;-webkit-appearance:none;appearance:none}
.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.linkbtn{font-size:12px;padding:8px 10px}.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:520px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.val{font-size:21px}.bottom{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>Debt Pool</h1><div class="sub">90 天现金流 · 循环消费与大笔债务分池</div>
<div class="grid">
<div class="card"><div class="lab">当前现金</div><div class="val" id="cash">¥0</div></div>
<div class="card"><div class="lab">全部负债</div><div class="val" id="debt">¥0</div></div>
<div class="card"><div class="lab">未来90天收入</div><div class="val green" id="inc">¥0</div></div>
<div class="card"><div class="lab">未来90天支出/还款</div><div class="val red" id="out">¥0</div></div>
<div class="card wide"><div class="lab">未来90天最低现金余额</div><div class="val" id="min">¥0</div><div class="meta" id="minDate"></div></div>
</div>
<section><h2>本月重点还款</h2><div class="card focus" id="focus"></div></section>
<section><h2>未来 3 个月</h2><div class="card" id="events"></div></section>
<section><h2>循环消费账户</h2><div class="card" id="revolving"></div></section>
<section><h2>大笔债务</h2><div class="card" id="longdebt"></div></section>
</main>
<div class="bottom"><button onclick="show('eventSheet')">+ 收入/支出</button><button onclick="show('accountSheet')">更新账户</button><button class="dark" onclick="showSettings()">设置</button></div>

<div class="sheet" id="eventSheet"><div class="panel"><h3>添加现金流事项</h3><div class="fields">
<div class="field"><label>类型</label><select id="etype"><option value="income">收入</option><option value="expense">计划支出</option><option value="repayment">还款</option></select></div>
<div class="field"><label>状态</label><select id="estatus"><option value="planned">预计</option><option value="actual">实际发生</option></select></div>
<div class="field"><label>金额</label><input id="eamount" inputmode="decimal" type="number"></div>
<div class="field"><label>日期</label><input id="edate" type="date"></div>
<div class="field full"><label>名称</label><input id="ename" type="text" placeholder="工资 / 计划支出"></div>
</div><div class="actions"><button onclick="hide('eventSheet')">取消</button><button class="dark" onclick="addEvent()">保存</button></div></div></div>

<div class="sheet" id="accountSheet"><div class="panel"><h3>更新现金 / 债务</h3><div class="fields">
<div class="field full"><label>当前现金</label><input id="cashEdit" inputmode="decimal" type="number"></div>
<div class="field"><label>账户类型</label><select id="atype"><option value="revolving">循环消费</option><option value="debt">大笔债务</option></select></div>
<div class="field"><label>名称</label><input id="aname" type="text" placeholder="信用卡 / 创业贷"></div>
<div class="field"><label>当前负债</label><input id="abalance" inputmode="decimal" type="number"></div>
<div class="field"><label>本期应还</label><input id="adue" inputmode="decimal" type="number"></div>
<div class="field"><label>还款日</label><input id="adate" type="date"></div>
</div><div class="hint">同名账户再次保存会更新原账户，不会重复创建。</div><div class="actions"><button onclick="hide('accountSheet')">取消</button><button class="dark" onclick="saveAccount()">保存</button></div></div></div>

<div class="sheet" id="settingsSheet"><div class="panel"><h3>设置与备份</h3><div class="fields">
<div class="field"><label>每月发薪日</label><input id="salaryDay" inputmode="numeric" type="number" min="1" max="31"></div>
<div class="field"><label>预计月工资</label><input id="salaryAmount" inputmode="decimal" type="number"></div>
<div class="field"><label>每月最后一天固定收入</label><input id="monthEndAmount" inputmode="decimal" type="number"></div>
<div class="field"><label>固定收入名称</label><input id="monthEndName" type="text"></div>
<div class="field full"><label>本月重点还款账户</label><select id="focusId"></select></div>
<div class="field full"><label>本月重点还款目标</label><input id="focusTarget" inputmode="decimal" type="number"></div>
</div>
<div class="backup"><button class="linkbtn" onclick="exportBackup()">导出备份 JSON</button><button class="linkbtn" onclick="document.getElementById('importFile').click()">导入备份</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></div>
<div class="hint">备份文件只在你主动导出时生成。建议每次大改版本前先导出一份。</div>
<div class="actions"><button onclick="hide('settingsSheet')">取消</button><button class="dark" onclick="saveSettings()">保存</button></div></div></div>

<script>
var KEY="debt_pool_v2_fixed";
function safeJSON(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
var state=safeJSON(KEY);
if(!state){
  var old=safeJSON("debt_pool_v2")||safeJSON("debt_pool_v1")||{};
  state={
    cash:Number(old.cash||0),
    accounts:Array.isArray(old.accounts)?old.accounts:(Array.isArray(old.debts)?old.debts.map(function(d){d.type=d.type||"debt";return d;}):[]),
    events:Array.isArray(old.events)?old.events:[],
    settings:Object.assign({salaryDay:7,salaryAmount:0,monthEndAmount:10000,monthEndName:"创业贷还款支持",focusId:"",focusTarget:0},old.settings||{})
  };
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function money(n){return "¥"+Number(n||0).toLocaleString("zh-CN",{maximumFractionDigits:2})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function date(s){return new Date(s+"T00:00:00")}
function id(){return String(Date.now())+String(Math.random()).slice(2)}
function show(x){document.getElementById(x).classList.add("open"); if(x==="accountSheet")document.getElementById("cashEdit").value=state.cash}
function hide(x){document.getElementById(x).classList.remove("open")}
function fixed(){
 var a=[],now=today(),s=state.settings;
 for(var i=0;i<4;i++){
  var first=new Date(now.getFullYear(),now.getMonth()+i,1),last=new Date(first.getFullYear(),first.getMonth()+1,0);
  var sd=Math.min(Number(s.salaryDay||7),last.getDate()),pay=new Date(first.getFullYear(),first.getMonth(),sd);
  if(pay>=now&&Number(s.salaryAmount)>0)a.push({type:"income",amount:Number(s.salaryAmount),date:iso(pay),name:"工资（预计）",fixed:true});
  if(last>=now&&Number(s.monthEndAmount)>0)a.push({type:"income",amount:Number(s.monthEndAmount),date:iso(last),name:(s.monthEndName||"月末固定收入")+"（预计）",fixed:true});
 } return a
}
function future(){
 var n=today(),end=new Date(n);end.setDate(end.getDate()+90);
 return state.events.filter(function(e){return e.status!=="actual"&&date(e.date)>=n&&date(e.date)<=end}).concat(fixed()).sort(function(a,b){return a.date.localeCompare(b.date)})
}
function render(){
 document.getElementById("cash").textContent=money(state.cash);
 var td=state.accounts.reduce(function(s,a){return s+Number(a.balance||0)},0);document.getElementById("debt").textContent=money(td);
 var ev=future(),inc=0,out=0,b=Number(state.cash),mn=b,md="现在";
 ev.forEach(function(e){if(e.type==="income"){inc+=Number(e.amount);b+=Number(e.amount)}else{out+=Number(e.amount);b-=Number(e.amount)}if(b<mn){mn=b;md=e.date}});
 document.getElementById("inc").textContent=money(inc);document.getElementById("out").textContent=money(out);
 var m=document.getElementById("min");m.textContent=money(mn);m.className="val "+(mn<0?"red":"green");document.getElementById("minDate").textContent="最低点："+md;
 renderEvents(ev);renderAccounts("revolving","revolving");renderAccounts("debt","longdebt");renderFocus()
}
function renderEvents(ev){var x=document.getElementById("events");x.innerHTML="";if(!ev.length){x.innerHTML='<div class="empty">暂无未来事项</div>';return}ev.forEach(function(e){var r=document.createElement("div");r.className="row";r.innerHTML='<div><div class="name">'+(e.name||"事项")+'</div><div class="meta">'+e.date+(e.fixed?" · 自动预测":"")+'</div></div><div class="amount '+(e.type==="income"?"green":"red")+'">'+(e.type==="income"?"+":"−")+money(e.amount)+'</div>';x.appendChild(r)})}
function renderAccounts(type,target){var x=document.getElementById(target);x.innerHTML="";var a=state.accounts.filter(function(z){return (z.type||"debt")===type});if(!a.length){x.innerHTML='<div class="empty">暂无账户</div>';return}a.forEach(function(z){var r=document.createElement("div");r.className="row";r.innerHTML='<div><div class="name">'+z.name+'</div><div class="meta">'+(z.dueDate?"还款 "+z.dueDate+" · 本期 "+money(z.dueAmount):"未设置还款日")+'</div></div><div class="amount">'+money(z.balance)+'</div>';x.appendChild(r)})}
function renderFocus(){var x=document.getElementById("focus"),a=state.accounts.find(function(z){return z.id===state.settings.focusId});if(!a){x.innerHTML='<div class="empty">在设置里选择本月重点还款项目。</div>';return}x.innerHTML='<div class="name">'+a.name+'</div><div class="val red">'+money(state.settings.focusTarget||a.dueAmount||0)+'</div><div class="meta">本月目标还款 · 当前负债 '+money(a.balance)+'</div>'}
function addEvent(){var amt=Number(document.getElementById("eamount").value),dt=document.getElementById("edate").value;if(!amt||!dt){alert("请填写金额和日期");return}state.events.push({id:id(),type:document.getElementById("etype").value,status:document.getElementById("estatus").value,amount:amt,date:dt,name:document.getElementById("ename").value.trim()||"事项"});hide("eventSheet");save()}
function saveAccount(){state.cash=Number(document.getElementById("cashEdit").value||0);var name=document.getElementById("aname").value.trim();if(name){var type=document.getElementById("atype").value,a=state.accounts.find(function(z){return z.name===name&&z.type===type});var obj={type:type,name:name,balance:Number(document.getElementById("abalance").value||0),dueAmount:Number(document.getElementById("adue").value||0),dueDate:document.getElementById("adate").value};if(a)Object.assign(a,obj);else{obj.id=id();state.accounts.push(obj)}}hide("accountSheet");save()}
function showSettings(){var s=state.settings;document.getElementById("salaryDay").value=s.salaryDay||7;document.getElementById("salaryAmount").value=s.salaryAmount||"";document.getElementById("monthEndAmount").value=s.monthEndAmount||10000;document.getElementById("monthEndName").value=s.monthEndName||"创业贷还款支持";var sel=document.getElementById("focusId");sel.innerHTML='<option value="">未设置</option>'+state.accounts.map(function(a){return '<option value="'+a.id+'">'+a.name+'</option>'}).join("");sel.value=s.focusId||"";document.getElementById("focusTarget").value=s.focusTarget||"";show("settingsSheet")}
function saveSettings(){state.settings={salaryDay:Number(document.getElementById("salaryDay").value||7),salaryAmount:Number(document.getElementById("salaryAmount").value||0),monthEndAmount:Number(document.getElementById("monthEndAmount").value||0),monthEndName:document.getElementById("monthEndName").value.trim(),focusId:document.getElementById("focusId").value,focusTarget:Number(document.getElementById("focusTarget").value||0)};hide("settingsSheet");save()}
function exportBackup(){var blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state:state},null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="debt-pool-backup-"+iso(today())+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function importBackup(input){var f=input.files&&input.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result),s=o.state||o;if(!s||!Array.isArray(s.accounts))throw new Error();state=s;save();hide("settingsSheet");alert("备份已恢复")}catch(e){alert("这个备份文件无法读取")}};rd.readAsText(f)}
render();
</script>
</body></html>
