<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Debt Pool</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#047857;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:780px;margin:auto;padding:22px 14px 120px}h1{font-size:30px;margin:5px 0 3px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 1px 3px #0000000c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.lab{font-size:12px;color:var(--muted)}.val{font-size:24px;font-weight:800;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}
section{margin-top:18px}h2{font-size:18px;margin:0 0 8px 2px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:750}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.amount{font-weight:800;white-space:nowrap}.empty{font-size:13px;color:var(--muted)}
.monthbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.monthtitle{font-weight:800;margin-bottom:6px}.minihead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.monitor{border:2px solid var(--ink)}.monitorStats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.stat{background:#f9fafb;border-radius:12px;padding:10px}.stat .v{font-weight:800;font-size:18px;margin-top:4px}
.accountGrid{display:grid;gap:10px}.account{border:1px solid var(--line);border-radius:14px;padding:13px}.accountTop{display:flex;justify-content:space-between;gap:10px}.accountNums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.num{background:#f9fafb;border-radius:10px;padding:9px}.num b{display:block;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pill{font-size:11px;background:#f3f4f6;padding:5px 8px;border-radius:999px;color:var(--muted)}
button{border:0;border-radius:13px;padding:12px;font-weight:800;font-size:14px;background:white;color:var(--ink);box-shadow:0 1px 3px #0002}.dark{background:#111827;color:white}.danger{color:var(--red)}
.bottom{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(752px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:20}

.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);padding:16px;overflow:auto}
.overlay.open{display:block}.panel{max-width:700px;margin:5vh auto;background:white;border-radius:22px;padding:18px;box-shadow:0 20px 60px #0005}
.panel h3{margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-height:48px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:#111827;padding:11px 12px;font-size:16px;-webkit-appearance:none;appearance:none;position:relative;z-index:1}
textarea{min-height:130px;font-size:12px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.backupBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:540px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.monitorStats,.accountNums{grid-template-columns:1fr 1fr}.val{font-size:21px}}
</style>
</head>
<body>
<main>
<h1>Debt Pool</h1>
<div class="sub">现金 · 循环消费账户 · 大额贷款 · 本月还款监控 · 未来 3 个月现金流</div>

<div class="grid">
  <div class="card"><div class="lab">当前现金</div><div class="val" id="cashTop">¥0</div></div>
  <div class="card"><div class="lab">总负债</div><div class="val" id="debtTop">¥0</div></div>
  <div class="card"><div class="lab">循环消费负债</div><div class="val" id="revDebtTop">¥0</div></div>
  <div class="card"><div class="lab">循环账户可消费额度</div><div class="val green" id="availableCreditTop">¥0</div></div>
</div>

<section>
  <h2>本月还款监控</h2>
  <div class="card monitor">
    <div class="monitorStats">
      <div class="stat"><div class="lab">现金余额</div><div class="v" id="monthCash">¥0</div></div>
      <div class="stat"><div class="lab">本月收入</div><div class="v green" id="monthIncomeTotal">¥0</div></div>
      <div class="stat"><div class="lab">本月应还</div><div class="v red" id="monthDueTotal">¥0</div></div>
    </div>
    <div class="minihead">本月收入</div><div id="monthIncomeList"></div>
    <div class="minihead">本月全部还款</div><div id="monthDueList"></div>
    <div class="minihead">本月还款后余量</div><div class="val" id="monthAfter">¥0</div>
  </div>
</section>

<section><h2>未来 3 个月预计现金流</h2><div class="card" id="threeMonth"></div></section>
<section><h2>循环消费账户</h2><div class="accountGrid" id="revolvingList"></div></section>
<section><h2>大额贷款</h2><div class="accountGrid" id="loanList"></div></section>
</main>

<div class="bottom">
<button id="openEventBtn">+ 收入/支出</button>
<button id="openAccountBtn">更新账户</button>
<button class="dark" id="openSettingsBtn">设置</button>
</div>

<div class="overlay" id="eventOverlay"><div class="panel">
<h3>收入 / 支出 / 还款事项</h3>
<div class="fields">
<div class="field"><label>类型</label><select id="etype"><option value="income">收入</option><option value="expense">计划支出</option><option value="repayment">还款</option></select></div>
<div class="field"><label>状态</label><select id="estatus"><option value="planned">预计</option><option value="actual">实际发生</option></select></div>
<div class="field"><label>金额</label><input id="eamount" type="number" inputmode="decimal"></div>
<div class="field"><label>日期</label><input id="edate" type="date"></div>
<div class="field full"><label>名称</label><input id="ename" type="text" placeholder="工资 / 奖金 / 计划支出"></div>
</div>
<div class="actions"><button data-close="eventOverlay">取消</button><button class="dark" id="saveEventBtn">保存</button></div>
</div></div>

<div class="overlay" id="accountOverlay"><div class="panel">
<h3>更新账户</h3>
<div class="fields">
<div class="field full"><label>当前现金（可一起更新）</label><input id="cashEdit" type="number" inputmode="decimal"></div>
<div class="field"><label>账户类型</label><select id="atype"><option value="revolving">循环消费账户</option><option value="loan">大额贷款</option></select></div>
<div class="field"><label>账户名称</label><input id="aname" type="text" placeholder="招行信用卡 / 花呗 / 白条 / 创业贷"></div>
<div class="field"><label>当前负债</label><input id="abalance" type="number" inputmode="decimal"></div>
<div class="field"><label>本期应还</label><input id="adue" type="number" inputmode="decimal"></div>
<div class="field"><label>还款日</label><input id="adate" type="date"></div>
<div class="field"><label>总额度（循环账户）</label><input id="alimit" type="number" inputmode="decimal"></div>
<div class="field"><label>预留不可消费额度</label><input id="areserve" type="number" inputmode="decimal" value="0"></div>
</div>
<div class="meta" style="margin-top:8px">可消费额度 = 总额度 − 当前负债 − 预留不可消费额度。</div>
<div class="actions"><button data-close="accountOverlay">取消</button><button class="dark" id="saveAccountBtn">保存</button></div>
</div></div>

<div class="overlay" id="settingsOverlay"><div class="panel">
<h3>定期现金流与备份</h3>
<div class="fields">
<div class="field"><label>类型</label><select id="rtype"><option value="income">收入</option><option value="expense">支出</option><option value="repayment">还款</option></select></div>
<div class="field"><label>名称</label><input id="rname" type="text" placeholder="工资 / 创业贷支持"></div>
<div class="field"><label>金额</label><input id="ramount" type="number" inputmode="decimal"></div>
<div class="field"><label>每隔几个月</label><input id="rinterval" type="number" min="1" value="1"></div>
<div class="field"><label>发生日</label><select id="rday"><option value="7">7 日</option><option value="last">每月最后一天</option></select></div>
<div class="field"><label>开始日期</label><input id="rstart" type="date"></div>
<div class="field"><label>截止日期（可空）</label><input id="rend" type="date"></div>
</div>
<div class="backupBtns"><button id="addRecurringBtn">+ 添加定期规则</button></div>
<div id="recurringList" style="margin-top:10px"></div>

<div style="border-top:1px solid var(--line);margin:16px 0"></div>
<div class="field"><label>手动备份 / 恢复文本</label><textarea id="backupText" placeholder="生成后复制保存；恢复时粘贴回来"></textarea></div>
<div class="backupBtns">
<button id="makeBackupBtn">生成文本</button><button id="copyBackupBtn">复制</button><button id="restoreBackupBtn">恢复</button>
<button id="exportBackupBtn">导出 JSON</button><button id="importBackupBtn">导入 JSON</button>
<input id="importFile" type="file" accept=".json,application/json" style="display:none">
</div>
<div class="actions"><button class="dark" data-close="settingsOverlay">完成</button></div>
</div></div>

<script>
"use strict";
var KEY="debt_pool_v24";
function byId(id){return document.getElementById(id)}
function safeParse(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
var migrated=safeParse("debt_pool_v23")||safeParse("debt_pool_v2_fixed")||safeParse("debt_pool_v2")||safeParse("debt_pool_v1")||{};
var state=safeParse(KEY)||{
  cash:Number(migrated.cash||0),
  accounts:Array.isArray(migrated.accounts)?migrated.accounts.map(function(a){var c=Object.assign({},a);if(c.type==="debt")c.type="loan";return c}):(Array.isArray(migrated.debts)?migrated.debts.map(function(a){return Object.assign({},a,{type:"loan"})}):[]),
  events:Array.isArray(migrated.events)?migrated.events:[],
  recurring:Array.isArray(migrated.recurring)?migrated.recurring:[]
};
if(!Array.isArray(state.accounts))state.accounts=[];
if(!Array.isArray(state.events))state.events=[];
if(!Array.isArray(state.recurring))state.recurring=[];

function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function money(n){return "¥"+Number(n||0).toLocaleString("zh-CN",{maximumFractionDigits:2})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseDate(s){return new Date(s+"T00:00:00")}
function uid(){return String(Date.now())+"-"+Math.random().toString(36).slice(2)}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function monthEnd(d){return new Date(d.getFullYear(),d.getMonth()+1,0)}
function monthDiff(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())}
function inRange(d,a,b){return d>=a&&d<=b}

function openOverlay(id){byId(id).classList.add("open")}
function closeOverlay(id){byId(id).classList.remove("open")}

function recurringEvents(start,end){
  var out=[];
  state.recurring.forEach(function(r){
    var rs=r.start?parseDate(r.start):start;
    var re=r.end?parseDate(r.end):end;
    if(re>end)re=end;
    var first=monthStart(rs), last=monthStart(re), interval=Math.max(1,Number(r.interval||1));
    for(var cur=new Date(first);cur<=last;cur=new Date(cur.getFullYear(),cur.getMonth()+1,1)){
      var diff=monthDiff(first,cur);
      if(diff<0||diff%interval!==0)continue;
      var d;
      if(r.day==="last") d=monthEnd(cur);
      else{
        var ld=monthEnd(cur).getDate();
        d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(Number(r.day||1),ld));
      }
      if(d>=rs&&d<=re&&d>=start&&d<=end){
        out.push({id:"rec-"+r.id+"-"+iso(d),type:r.type,amount:Number(r.amount||0),date:iso(d),name:r.name,status:"planned",fixed:true});
      }
    }
  });
  return out;
}
function manualEvents(start,end){
  return state.events.filter(function(e){return e.status!=="actual"&&e.date&&inRange(parseDate(e.date),start,end)})
}
function forecast(start,end){
  return manualEvents(start,end).concat(recurringEvents(start,end)).sort(function(a,b){return a.date.localeCompare(b.date)})
}
function totalDebt(type){
  return state.accounts.filter(function(a){return !type||a.type===type}).reduce(function(s,a){return s+Number(a.balance||0)},0)
}
function totalAvailableCredit(){
  return state.accounts.filter(function(a){return a.type==="revolving"}).reduce(function(s,a){
    return s+Math.max(0,Number(a.limit||0)-Number(a.balance||0)-Number(a.reserve||0))
  },0)
}
function rowNode(name,meta,amount,cls){
  var r=document.createElement("div");r.className="row";
  var left=document.createElement("div");
  var n=document.createElement("div");n.className="name";n.textContent=name;
  var m=document.createElement("div");m.className="meta";m.textContent=meta||"";
  left.appendChild(n);left.appendChild(m);
  var a=document.createElement("div");a.className="amount "+(cls||"");a.textContent=amount;
  r.appendChild(left);r.appendChild(a);return r
}
function render(){
  byId("cashTop").textContent=money(state.cash);
  byId("debtTop").textContent=money(totalDebt());
  byId("revDebtTop").textContent=money(totalDebt("revolving"));
  byId("availableCreditTop").textContent=money(totalAvailableCredit());
  renderMonthMonitor();renderThreeMonth();renderAccounts("revolving","revolvingList");renderAccounts("loan","loanList");renderRecurringList()
}
function renderMonthMonitor(){
  var now=today(),ms=monthStart(now),me=monthEnd(now),ev=forecast(ms,me);
  var incomes=ev.filter(function(e){return e.type==="income"});
  var dues=state.accounts.filter(function(a){return a.dueDate&&inRange(parseDate(a.dueDate),ms,me)});
  var repayments=ev.filter(function(e){return e.type==="repayment"});
  var inc=incomes.reduce(function(s,e){return s+Number(e.amount)},0);
  var due=dues.reduce(function(s,a){return s+Number(a.dueAmount||0)},0)+repayments.reduce(function(s,e){return s+Number(e.amount)},0);
  byId("monthCash").textContent=money(state.cash);byId("monthIncomeTotal").textContent=money(inc);byId("monthDueTotal").textContent=money(due);
  var il=byId("monthIncomeList");il.innerHTML="";
  if(!incomes.length)il.innerHTML='<div class="empty">本月暂无收入</div>';
  incomes.forEach(function(e){il.appendChild(rowNode(e.name,e.date,"+"+money(e.amount),"green"))});
  var dl=byId("monthDueList");dl.innerHTML="";
  if(!dues.length&&!repayments.length)dl.innerHTML='<div class="empty">本月暂无还款</div>';
  dues.sort(function(a,b){return a.dueDate.localeCompare(b.dueDate)}).forEach(function(a){dl.appendChild(rowNode(a.name,a.dueDate,"−"+money(a.dueAmount),"red"))});
  repayments.forEach(function(e){dl.appendChild(rowNode(e.name,e.date,"−"+money(e.amount),"red"))});
  var after=Number(state.cash)+inc-due,el=byId("monthAfter");el.textContent=money(after);el.className="val "+(after<0?"red":"green")
}
function renderThreeMonth(){
  var box=byId("threeMonth");box.innerHTML="";var now=today(),running=Number(state.cash);
  for(var i=0;i<3;i++){
    var d=new Date(now.getFullYear(),now.getMonth()+i,1),ms=monthStart(d),me=monthEnd(d),ev=forecast(ms,me);
    var dues=state.accounts.filter(function(a){return a.dueDate&&inRange(parseDate(a.dueDate),ms,me)}).map(function(a){return {type:"repayment",name:a.name,amount:Number(a.dueAmount||0),date:a.dueDate}});
    var combined=ev.concat(dues).sort(function(a,b){return a.date.localeCompare(b.date)});
    var inc=combined.filter(function(e){return e.type==="income"}).reduce(function(s,e){return s+Number(e.amount)},0);
    var out=combined.filter(function(e){return e.type!=="income"}).reduce(function(s,e){return s+Number(e.amount)},0);
    running+=inc-out;
    var mb=document.createElement("div");mb.className="monthbox";
    var title=document.createElement("div");title.className="monthtitle";title.textContent=(d.getMonth()+1)+" 月";mb.appendChild(title);
    var pills=document.createElement("div");pills.className="pills";
    [["收入 "+money(inc)],["支出/还款 "+money(out)],["月末预计现金 "+money(running)]].forEach(function(t){var p=document.createElement("span");p.className="pill";p.textContent=t[0];pills.appendChild(p)});
    mb.appendChild(pills);
    if(!combined.length){var e=document.createElement("div");e.className="empty";e.style.marginTop="10px";e.textContent="暂无事项";mb.appendChild(e)}
    combined.forEach(function(e){mb.appendChild(rowNode(e.name,e.date,(e.type==="income"?"+":"−")+money(e.amount),e.type==="income"?"green":"red"))});
    box.appendChild(mb)
  }
}
function renderAccounts(type,target){
  var box=byId(target);box.innerHTML="";var arr=state.accounts.filter(function(a){return a.type===type});
  if(!arr.length){box.innerHTML='<div class="card empty">暂无账户</div>';return}
  arr.forEach(function(a){
    var av=type==="revolving"?Math.max(0,Number(a.limit||0)-Number(a.balance||0)-Number(a.reserve||0)):0;
    var c=document.createElement("div");c.className="account card";
    var top=document.createElement("div");top.className="accountTop";
    var left=document.createElement("div");
    var nm=document.createElement("div");nm.className="name";nm.textContent=a.name;
    var meta=document.createElement("div");meta.className="meta";meta.textContent=a.dueDate?"还款 "+a.dueDate:"未设置还款日";
    left.appendChild(nm);left.appendChild(meta);
    var edit=document.createElement("button");edit.textContent="编辑";edit.addEventListener("click",function(){editAccount(a.id)});
    top.appendChild(left);top.appendChild(edit);c.appendChild(top);
    var nums=document.createElement("div");nums.className="accountNums";
    function addNum(label,val,cls){var n=document.createElement("div");n.className="num";var l=document.createElement("div");l.className="lab";l.textContent=label;var b=document.createElement("b");if(cls)b.className=cls;b.textContent=val;n.appendChild(l);n.appendChild(b);nums.appendChild(n)}
    addNum("当前负债",money(a.balance));addNum("本期应还",money(a.dueAmount));
    if(type==="revolving")addNum("可消费额度",money(av),"green");else addNum("类别","大额贷款");
    c.appendChild(nums);box.appendChild(c)
  })
}
function clearAccountForm(){
  byId("accountOverlay").dataset.edit="";
  byId("cashEdit").value=state.cash;byId("atype").value="revolving";
  ["aname","abalance","adue","adate","alimit","areserve"].forEach(function(x){byId(x).value=""})
}
function editAccount(id){
  var a=state.accounts.find(function(x){return x.id===id});if(!a)return;
  byId("accountOverlay").dataset.edit=id;byId("cashEdit").value=state.cash;byId("atype").value=a.type;byId("aname").value=a.name;byId("abalance").value=a.balance||0;byId("adue").value=a.dueAmount||0;byId("adate").value=a.dueDate||"";byId("alimit").value=a.limit||0;byId("areserve").value=a.reserve||0;openOverlay("accountOverlay")
}
function renderRecurringList(){
  var box=byId("recurringList");if(!box)return;box.innerHTML="";
  if(!state.recurring.length){box.innerHTML='<div class="empty">暂无定期规则</div>';return}
  state.recurring.forEach(function(r){
    var row=document.createElement("div");row.className="row";
    var left=document.createElement("div");var n=document.createElement("div");n.className="name";n.textContent=r.name;
    var m=document.createElement("div");m.className="meta";m.textContent=money(r.amount)+" · 每 "+(r.interval||1)+" 个月 · "+(r.day==="last"?"月底":r.day+" 日")+(r.end?" · 至 "+r.end:"");
    left.appendChild(n);left.appendChild(m);
    var del=document.createElement("button");del.className="danger";del.textContent="删除";del.addEventListener("click",function(){if(confirm("删除这条定期规则？")){state.recurring=state.recurring.filter(function(x){return x.id!==r.id});save();renderRecurringList()}});
    row.appendChild(left);row.appendChild(del);box.appendChild(row)
  })
}
function payload(){return {app:"Debt Pool",version:"2.4",exportedAt:new Date().toISOString(),state:state}}
function makeBackupText(){byId("backupText").value=JSON.stringify(payload(),null,2)}
function copyBackupText(){
  if(!byId("backupText").value)makeBackupText();
  var text=byId("backupText").value;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){alert("备份文本已复制")}).catch(function(){alert("请长按文本手动复制")})}
  else{byId("backupText").focus();byId("backupText").select();alert("请长按文本手动复制")}
}
function restoreBackupText(){
  try{var o=JSON.parse(byId("backupText").value.trim()),s=o.state||o;if(!s||!Array.isArray(s.accounts))throw new Error();if(!confirm("确认覆盖当前数据？"))return;state=s;save();alert("已恢复")}catch(e){alert("备份文本格式不正确")}
}
function exportBackup(){
  var blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="debt-pool-v24-"+iso(today())+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)
}
function importBackup(file){
  if(!file)return;var rd=new FileReader();
  rd.onload=function(){try{var o=JSON.parse(rd.result),s=o.state||o;if(!s||!Array.isArray(s.accounts))throw new Error();if(!confirm("确认覆盖当前数据？"))return;state=s;save();alert("已恢复")}catch(e){alert("无法读取备份")}};
  rd.readAsText(file)
}

byId("openEventBtn").addEventListener("click",function(){byId("edate").value=iso(today());byId("eamount").value="";byId("ename").value="";openOverlay("eventOverlay")});
byId("openAccountBtn").addEventListener("click",function(){clearAccountForm();openOverlay("accountOverlay")});
byId("openSettingsBtn").addEventListener("click",function(){byId("rstart").value=iso(today());renderRecurringList();openOverlay("settingsOverlay")});
document.querySelectorAll("[data-close]").forEach(function(btn){btn.addEventListener("click",function(){closeOverlay(btn.getAttribute("data-close"))})});
document.querySelectorAll(".overlay").forEach(function(ov){ov.addEventListener("click",function(e){if(e.target===ov)closeOverlay(ov.id)})});

byId("saveEventBtn").addEventListener("click",function(){
  var amt=Number(byId("eamount").value),dt=byId("edate").value;if(!amt||!dt){alert("请填写金额和日期");return}
  state.events.push({id:uid(),type:byId("etype").value,status:byId("estatus").value,amount:amt,date:dt,name:byId("ename").value.trim()||"事项"});closeOverlay("eventOverlay");save()
});
byId("saveAccountBtn").addEventListener("click",function(){
  state.cash=Number(byId("cashEdit").value||0);var name=byId("aname").value.trim();
  if(name){
    var obj={type:byId("atype").value,name:name,balance:Number(byId("abalance").value||0),dueAmount:Number(byId("adue").value||0),dueDate:byId("adate").value,limit:Number(byId("alimit").value||0),reserve:Number(byId("areserve").value||0)};
    var id=byId("accountOverlay").dataset.edit;
    if(id){var a=state.accounts.find(function(x){return x.id===id});if(a)Object.assign(a,obj)}
    else{obj.id=uid();state.accounts.push(obj)}
  }
  closeOverlay("accountOverlay");save()
});
byId("addRecurringBtn").addEventListener("click",function(){
  var name=byId("rname").value.trim(),amt=Number(byId("ramount").value),st=byId("rstart").value;if(!name||!amt||!st){alert("请填写名称、金额和开始日期");return}
  state.recurring.push({id:uid(),type:byId("rtype").value,name:name,amount:amt,interval:Math.max(1,Number(byId("rinterval").value||1)),day:byId("rday").value,start:st,end:byId("rend").value});
  byId("rname").value="";byId("ramount").value="";byId("rend").value="";save();renderRecurringList()
});
byId("makeBackupBtn").addEventListener("click",makeBackupText);
byId("copyBackupBtn").addEventListener("click",copyBackupText);
byId("restoreBackupBtn").addEventListener("click",restoreBackupText);
byId("exportBackupBtn").addEventListener("click",exportBackup);
byId("importBackupBtn").addEventListener("click",function(){byId("importFile").click()});
byId("importFile").addEventListener("change",function(){importBackup(this.files&&this.files[0])});

render();
</script>
</body>
</html>
